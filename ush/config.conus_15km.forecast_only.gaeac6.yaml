user:
  #
  # If expt_basedir is set to an absolute path, it will be used as is.  If
  # it is not set or is set to an empty string, it will be set to a default
  # absolute path (currently specified in experiment_gen.py).  If it is set
  # to a relative path, it will be appended to the default path.  The path
  # to the experiment is then formed by appending the experiment name 
  # (expt_name below) to expt_basedir.
  #
  expt_basedir:
#  expt_basedir: "sppt_timing_tests/{{ user.mesh_label }}"
  #
  # Set the experiment name.  If this is set to an empty string (or is not
  # set at all) or if create_expt_name below is set to True, the experiment
  # name will be formed from the name of the last config file passed to the
  # experiment_gen.py script and, if create_expt_name is set to True, possibly
  # other parameters such as the mesh name.
  #
  expt_name: 
  #
  # If create_expt_name is True, the experiment name is always formed from
  # the name of the last config file passed on the command line to the
  # experiment_gen.py script and possibly other parameters such as the mesh
  # name, and the value of expt_name above is ignored.
  #
  create_expt_name: False
#  create_expt_name: True
#
# Note that !!timestamp will convert the given date and time such that
# first_cycle (for example) gets reset to this format (in Jinja2 syntax):
#
#   "{{ user.first_cycle.strftime('%Y%m%d%H') }}"
#
  first_cycle: !!timestamp 2023-09-15T00:00:00
  last_cycle:  !!timestamp 2023-09-15T00:00:00
  cycle_frequency: 12
#
  mesh_label: conus_15km
  mpas_app: ''
  platform: gaeac6
##  build_type: 'debug'
#  build_type: 'optimized'
  #
#  config_mp: 'mp_thompson'
#  config_mp: 'mp_thompson_aerosols'
  config_mp: 'mp_tempo'
  #
  workflow_blocks:
    - cold_start_staged_ics_lbcs.yaml

auxil:
  mpas_model_dir: "{{ user.mpas_app }}/src/MPAS-Model"
  physics_dir: "{{auxil.mpas_model_dir }}/src/core_atmosphere/physics"
  wrf_physics_tables_dir: "{{auxil.physics_dir }}/physics_wrf/files"
  tempo_submodule_dir: "{{auxil.physics_dir }}/physics_noaa/TEMPO"
  dummy_target: "/dev/null"
  #
  # Names of symlinks to create in the forecast directory that point to
  # various microphysics tables.  The number and names of these depend on
  # the microphysics parameterization being used.
  #
  # Note that:
  #
  # * The CCN activation lookup table for Thompson MP, i.e. CCN_ACTIVATE_DATA,
  #   (along with many other physics lookup tables) is downloaded by the script
  #   checkout_data_files.sh by the lookup_tables make target in
  #   MPAS-Model/src/core_atmosphere/physics/Makefile.
  #
  # * The CCN activation lookup table for TEMPO MP, i.e. ccn_activate.bin, is
  #   a tracked file in the TEMPO submodule and is thus immediately available
  #   after MPAS-Model is (recursively) cloned. 
  #
  mp_table_ccn_activate_symlink: '{%- if user.config_mp == "mp_tempo" -%}ccn_activate.bin{%- elif user.config_mp == "mp_thompson_aerosols" -%}CCN_ACTIVATE_DATA{%- else -%}unused_mp_table_ccn_activate{%- endif -%}'
  mp_table_qr_acr_qs_symlink: '{%- if user.config_mp == "mp_tempo" -%}qr_acr_qs_data_tempo_v3{%- elif user.config_mp in ["mp_thompson", "mp_thompson_aerosols"] -%}MP_THOMPSON_QRacrQS_DATA.DBL{%- else -%}unused_mp_table_qr_acr_qs{%- endif -%}'
  mp_table_qr_acr_qg_symlink: '{%- if user.config_mp == "mp_tempo" -%}qr_acr_qg_data_tempo_v3{%- elif user.config_mp in ["mp_thompson", "mp_thompson_aerosols"] -%}MP_THOMPSON_QRacrQG_DATA.DBL{%- else -%}unused_mp_table_qr_acr_qg{%- endif -%}'
  mp_table_qi_aut_qs_symlink: '{%- if user.config_mp in ["mp_thompson", "mp_thompson_aerosols"] -%}MP_THOMPSON_QIautQS_DATA.DBL{%- else -%}unused_mp_table_qi_aut_qs{%- endif -%}'
  mp_table_freeze_water_symlink: '{%- if user.config_mp == "mp_tempo" -%}freeze_water_data_tempo_v3{%- elif user.config_mp in ["mp_thompson", "mp_thompson_aerosols"] -%}MP_THOMPSON_freezeH2O_DATA.DBL{%- else -%}unused_mp_table_freeze_water{%- endif -%}'
  #
  # The full paths to the targets that the micophysics symlinks above must
  # point to.  As above, these depend on the microphysics parameterization
  # being used.
  #
  mp_table_ccn_activate_target: '{%- if user.config_mp == "mp_tempo" -%}{{ auxil.tempo_submodule_dir }}/tables/{{ auxil.mp_table_ccn_activate_symlink }}{%- elif user.config_mp == "mp_thompson_aerosols" -%}{{ auxil.wrf_physics_tables_dir }}/{{ auxil.mp_table_ccn_activate_symlink }}{%- else -%}{{ auxil.dummy_target }}{%- endif -%}'
  mp_table_qr_acr_qs_target: '{%- if user.config_mp in ["mp_tempo", "mp_thompson", "mp_thompson_aerosols"] -%}{{ auxil.mpas_model_dir }}/{{ auxil.mp_table_qr_acr_qs_symlink }}{%- else -%}{{ auxil.dummy_target }}{%- endif -%}'
  mp_table_qr_acr_qg_target: '{%- if user.config_mp in ["mp_tempo", "mp_thompson", "mp_thompson_aerosols"] -%}{{ auxil.mpas_model_dir }}/{{ auxil.mp_table_qr_acr_qg_symlink }}{%- else -%}{{ auxil.dummy_target }}{%- endif -%}'
  mp_table_qi_aut_qs_target: '{%- if user.config_mp in ["mp_thompson", "mp_thompson_aerosols"] -%}{{ auxil.mpas_model_dir }}/{{ auxil.mp_table_qi_aut_qs_symlink }}{%- else -%}{{ auxil.dummy_target }}{%- endif -%}'
  mp_table_freeze_water_target: '{%- if user.config_mp in ["mp_tempo", "mp_thompson", "mp_thompson_aerosols"] -%}{{ auxil.mpas_model_dir }}/{{ auxil.mp_table_freeze_water_symlink }}{%- else -%}{{ auxil.dummy_target }}{%- endif -%}'

data:
  mesh_files: "/gpfs/f6/wrfruc/scratch/Gerard.Ketefian/mesh_and_static_files"
  staged_ics_lbcs_dir: "/gpfs/f6/wrfruc/scratch/Gerard.Ketefian/mpas_staged_ics_lbcs"

platform:
  scheduler: slurm
  account: wrfruc

wflow_launch:
  launch_script_fn: 'launch_wflow.py'
  launch_wrapper_fn: 'launch_wflow_wrapper.sh'
  launch_log_fn: 'log.launch_wflow'

cron:
  use_cron_to_relaunch: True
  cron_relaunch_intvl_mnts: 1
  # This will be set by the experiment generation script, so it doesn't matter what it
  # is set to here.  Leave it to its default value.
  crontab_line: None

# Remove the top-level uwtools config sections that are present by default but
# that are not needed for a forecast-only experiment.
get_ics_data: !remove
get_lbcs_data: !remove
prepare_grib: !remove
create_ics: !remove
create_lbcs: !remove

# Remove corresponding tasks in the rocoto workflow section.
workflow:
  tasks:
    task_get_ics_data: !remove
    task_get_lbcs_data: !remove
    task_ungrib: !remove
    task_mpas_ics: !remove
    task_mpas_lbcs: !remove

forecast:
  mpas:
    execution:
      batchargs:
        #
        # On Gaea C6, for a 6-hr forecast with config_dt = 60 sec and output
        # every hour:
        #
        # - With 32 cores, the forecast takes about ??? seconds (??.? minutes).
        # - With 80 cores, the forecast takes about ??? seconds (??.? minutes).
        #
#        cores: 32
        cores: 80
#        walltime: 00:30:00
        walltime: 02:30:00
        native: '--exclusive'
        maxtries: 1
        # This could be set to 'bigmem' on hera to access the big memory nodes there.
#        partition: '{{ user.platform }}'
        partition: 'batch'
      # The envcmds entries below are written verbatim as lines in the generated
      # runscript for the forecast task (runscript.mpas).
      envcmds:
        - ulimit -s unlimited || true
        - module use {{ user.mpas_app }}/modulefiles
        - module load build_{{ user.platform }}_intel
        #
        # The next command creates the forecast directory under the experiment directory
        # if the former doesn't already exist.  Usually, it will already exist because
        # of the files_to_copy and/or files_to_link sections below.
        #
        - mkdir -p {{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast
        #
        # Clean up the forecast directory by deleting any (unneeded) symlinks that point
        # to /dev/null.  These might be created by the files_to_link section below even
        # though those symlinks are not be needed (which is why they point to /dev/null),
        # and that can happen because different microphysics schemes (and possibly other
        # types of schemes) require different numbers of lookup tables.
        #
        - find {{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast -maxdepth 1 -type l -lname '/dev/null' -delete
      executable: "{{ user.mpas_app }}/exec/atmosphere_model"
#      executable: "{{ user.mpas_app }}/exec.gsl_develop_stoch.{{user.build_type}}/atmosphere_model"
#      executable: "{{ user.mpas_app }}/exec/atmosphere_model.{{user.build_type}}"
      mpiargs:
        - "--ntasks={{ forecast.mpas['execution']['batchargs']['cores']}}"
      mpicmd: srun
    files_to_copy:
      #
      # The initial conditions file.
      #
      '{{ user.mesh_label }}.init.nc': '{{ data.staged_ics_lbcs_dir }}/{{ user.mesh_label }}/{{user.first_cycle.strftime("%Y%m%d%H")}}/{{ user.mesh_label }}.init.nc'
      #
      # Copy the mesh partitioning file that specifies how the cells in the
      # mesh are distributed (partitioned) among MPI processes.  Note that
      # for serial runs (cores set to 1), MPAS doesn't actually read this
      # file.
      #
      "{{ user.mesh_label }}.graph.info.part.{{forecast.mpas['execution']['batchargs']['cores']}}": '{{ user.experiment_dir }}/{{ user.mesh_label }}.graph.info.part.{{forecast.mpas["execution"]["batchargs"]["cores"]}}'
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.surface"
    files_to_link: &mpas_files_to_link
      #
      # Physics tables.
      #
      CAM_ABS_DATA.DBL: "{{ auxil.mpas_model_dir }}/CAM_ABS_DATA.DBL"
      CAM_AEROPT_DATA.DBL: "{{ auxil.mpas_model_dir }}/CAM_AEROPT_DATA.DBL"
      GENPARM.TBL: "{{ auxil.mpas_model_dir }}/GENPARM.TBL"
      LANDUSE.TBL: "{{ auxil.mpas_model_dir }}/LANDUSE.TBL"
      OZONE_DAT.TBL: "{{ auxil.mpas_model_dir }}/OZONE_DAT.TBL"
      OZONE_LAT.TBL: "{{ auxil.mpas_model_dir }}/OZONE_LAT.TBL"
      OZONE_PLEV.TBL: "{{ auxil.mpas_model_dir }}/OZONE_PLEV.TBL"
      RRTMG_LW_DATA: "{{ auxil.mpas_model_dir }}/RRTMG_LW_DATA"
      RRTMG_LW_DATA.DBL: "{{ auxil.mpas_model_dir }}/RRTMG_LW_DATA.DBL"
      RRTMG_SW_DATA: "{{ auxil.mpas_model_dir }}/RRTMG_SW_DATA"
      RRTMG_SW_DATA.DBL: "{{ auxil.mpas_model_dir }}/RRTMG_SW_DATA.DBL"
      SOILPARM.TBL: "{{ auxil.mpas_model_dir }}/SOILPARM.TBL"
      VEGPARM.TBL: "{{ auxil.mpas_model_dir }}/VEGPARM.TBL"
      #
      # Links to microphysics tables (or, if not needed, to a dummy target, 
      # e.g. /dev/null).
      #
      '{{ auxil.mp_table_ccn_activate_symlink }}': '{{ auxil.mp_table_ccn_activate_target }}'
      '{{ auxil.mp_table_qr_acr_qs_symlink }}': '{{ auxil.mp_table_qr_acr_qs_target }}'
      '{{ auxil.mp_table_qr_acr_qg_symlink }}': '{{ auxil.mp_table_qr_acr_qg_target }}'
      '{{ auxil.mp_table_qi_aut_qs_symlink }}': '{{ auxil.mp_table_qi_aut_qs_target }}'
      '{{ auxil.mp_table_freeze_water_symlink }}': '{{ auxil.mp_table_freeze_water_target }}'
    #
    # If the lateral_boundary_conditions: key is present here (i.e. we do not
    # "!remove" it), the boundary_files method in the mpas.py script of uwtools
    # will always (because it is hardcoded to) generate time-stamped symlinks
    # of the form "lbc.YYYY-MM-DD_HH.MM.SS.nc" in the forecast directory that
    # point to files of the same names (i.e. also with time stamps in the name)
    # in the directory specified by the path: key under lateral_boundary_conditions:.
    #
    lateral_boundary_conditions:
      interval_hours: 6
      offset: 0
      path: "{{ data.staged_ics_lbcs_dir }}/{{ user.mesh_label }}/{{ user.first_cycle.strftime('%Y%m%d%H') }}"
    #
    # This is the length of the forecast.  Note that even if there is no
    # "update_values:" section under "namelist:" below, the final namelist
    # file in the forecast directory is modified from the one specified by
    # "base_file:" to reflect the length of the forecast specified here.
    #
    length: 6
    #
    # Specify a base namelist (base_file) along with the updates to make to
    # it (update_values) to get the final namelist(s) in each forecast directory
    # (there will be one for each initialization date).
    #
    # Note that even if there is no "update_values:" section here (because we
    # !remove it), the contents of the base namelist file will still be adjusted
    # to reflect the forecast start time(s) (times for muliple forecasts) and
    # the forecast length specified in this file.  In other words, even without
    # an update_values: section here, the forecast start times and forecast
    # lengths in the final namelist files written to the forecast directories
    # (represented by the namelist variables config_start_time and config_run_duration)
    # are always adjusted by mpas_app to reflect the values in this file (which
    # are user.first_cycle, user.last_cycle, and user.cycle_frequency for
    # determining the initialization times and forecast.mpas.length for
    # determining the forecast length, which is the same for all forecasts).
    # Other variables in the final namelist files are updated only if there
    # is an "update_values:" section below that provides new values for them.
    #
    namelist:
      base_file: "{{ auxil.mpas_model_dir }}/namelist.atmosphere"
      update_values:
        nhyd_model:
          config_dt: 60.0
        limited_area:
          config_apply_lbcs: true
        decomposition:
          config_block_decomp_file_prefix: "{{ user.mesh_label }}.graph.info.part."
        physics:
          config_physics_suite: convection_permitting
          config_microp_scheme: '{{ user.config_mp }}'
        #
        # Ideally, we would !remove the physics_mp_tempo namelist from the namelist
        # file when the microphysics used is not TEMPO.  But that doesn't seem to
        # work, so we simply leave it in since it's not used when the microphysics
        # isn't TEMPO.
        #
        #physics_mp_tempo: '{%- if user.config_mp != "mp_tempo" -%}!remove{%- endif -%}'
        physics_mp_tempo:
          config_tempo_hailaware: True
    rundir: '{{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast'
    streams:
      input:
        mutable: false
        type: input
        filename_template: "{{ user.mesh_label }}.init.nc"
        input_interval: "initial_only"
        io_type: "pnetcdf,cdf5"
      lbc_in:
        mutable: false
        type: input
        filename_template: "lbc.$Y-$M-$D_$h.$m.$s.nc"
        input_interval: "06:00:00"
        filename_interval: "input_interval"
        io_type: "pnetcdf,cdf5"
        packages: limited_area
#      restart:
#        mutable: false
#        type: "input;output"
#        filename_template: "restart.$Y-$M-$D_$h.$m.$s.nc"
#        io_type: "pnetcdf,cdf5"
#        input_interval: "initial_only"
#        output_interval: "1_00:00:00"
#        clobber_mode: overwrite
#      surface:
#        mutable: true
#        type: input
#        filename_template: "{{ user.mesh_label }}.sfc_update.nc"
#        filename_interval: "none"
#        input_interval: "none"
#        io_type: "pnetcdf,cdf5"
#        files:
#          - stream_list.atmosphere.surface
      output:
        mutable: true
        type: output
        filename_template: "history.$Y-$M-$D_$h.$m.$s.nc"
        output_interval: "01:00:00"
        # Set to length of forecast to get only an initial output file and one
        # at the end of the forecast.
# Apparently the !timedelta constructor is not yet implemented in this
# version of uwtools.  Probably need to update uwtools.
#        output_interval: !timedelta '{{forecast.mpas.length}}'
#        output_interval: '{{forecast.mpas.length}}:00:00'
        files:
          - stream_list.atmosphere.output
        clobber_mode: overwrite
      diagnostics:
        mutable: true
        type: output
        filename_template: "diag.$Y-$M-$D_$h.$m.$s.nc"
        output_interval: "01:00:00"
        # Set to length of forecast to get only an initial output file and one
        # at the end of the forecast.
# Apparently the !timedelta constructor is not yet implemented in this
# version of uwtools.  Probably need to update uwtools.
#        output_interval: !timedelta '{{forecast.mpas.length}}'
#        output_interval: '{{forecast.mpas.length}}:00:00'
        files:
          - stream_list.atmosphere.diagnostics
        clobber_mode: overwrite
  platform:
    account: '{{ platform.account }}'
    scheduler: '{{ platform.scheduler }}'
