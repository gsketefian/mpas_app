forecast:
  mpas:
    execution:
      batchargs:
#        cores: 32
        cores: 80
#        walltime: 00:30:00
        walltime: 02:30:00
        native: '--exclusive'
        maxtries: 1
        # This could be set to 'bigmem' on hera to access the big memory nodes there.
        partition: '{{ user.platform }}'
      envcmds:
        - ulimit -s unlimited || true
        - module use {{ user.mpas_app }}/modulefiles
        - module load build_{{ user.platform }}_intel
        - mkdir -p {{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast
      executable: "{{ user.mpas_app }}/exec/atmosphere_model"
#      executable: "{{ user.mpas_app }}/exec.gsl_develop_stoch.{{user.build_type}}/atmosphere_model"
#      executable: "{{ user.mpas_app }}/exec/atmosphere_model.{{user.build_type}}"
      mpiargs:
        - "--ntasks={{ forecast.mpas['execution']['batchargs']['cores']}}"
      mpicmd: srun
    files_to_copy:
      "{{ user.mesh_label }}.init.nc": "{{ data.staged_ics_lbcs_dir }}/{{ user.mesh_label }}/{{user.first_cycle.strftime('%Y%m%d%H')}}/{{ user.mesh_label }}.init.nc"
      "{{ user.mesh_label }}.graph.info.part.{{forecast.mpas['execution']['batchargs']['cores']}}": '{{ user.experiment_dir }}/{{ user.mesh_label }}.graph.info.part.{{forecast.mpas["execution"]["batchargs"]["cores"]}}'
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/stream_list.atmosphere.surface"
    files_to_link: &mpas_files_to_link
      CAM_ABS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/CAM_ABS_DATA.DBL"
      CAM_AEROPT_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/CAM_AEROPT_DATA.DBL"
      GENPARM.TBL: "{{ user.mpas_app }}/src/MPAS-Model/GENPARM.TBL"
      LANDUSE.TBL: "{{ user.mpas_app }}/src/MPAS-Model/LANDUSE.TBL"
      OZONE_DAT.TBL: "{{ user.mpas_app }}/src/MPAS-Model/OZONE_DAT.TBL"
      OZONE_LAT.TBL: "{{ user.mpas_app }}/src/MPAS-Model/OZONE_LAT.TBL"
      OZONE_PLEV.TBL: "{{ user.mpas_app }}/src/MPAS-Model/OZONE_PLEV.TBL"
      RRTMG_LW_DATA: "{{ user.mpas_app }}/src/MPAS-Model/RRTMG_LW_DATA"
      RRTMG_LW_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/RRTMG_LW_DATA.DBL"
      RRTMG_SW_DATA: "{{ user.mpas_app }}/src/MPAS-Model/RRTMG_SW_DATA"
      RRTMG_SW_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/RRTMG_SW_DATA.DBL"
      SOILPARM.TBL: "{{ user.mpas_app }}/src/MPAS-Model/SOILPARM.TBL"
      VEGPARM.TBL: "{{ user.mpas_app }}/src/MPAS-Model/VEGPARM.TBL"
      #
      # The following are now only applicable to Thompson MP.  They should
      # only be linked if using Thompson MP, but we don't know how to do that
      # with uwtools (since !remove doesn't work).
      #
#      MP_{{auxil.MP_NAME}}_freezeH2O_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_{{auxil.MP_NAME}}_freezeH2O_DATA.DBL"
#      MP_{{auxil.MP_NAME}}{{auxil.hailaware_str}}_QRacrQG_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_{{auxil.MP_NAME}}{{auxil.hailaware_str}}_QRacrQG_DATA.DBL"
#      MP_{{auxil.MP_NAME}}_QRacrQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_{{auxil.MP_NAME}}_QRacrQS_DATA.DBL"
#      MP_{{auxil.MP_NAME}}_QIautQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_{{auxil.MP_NAME}}_QIautQS_DATA.DBL"
      MP_THOMPSON_freezeH2O_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_freezeH2O_DATA.DBL"
      MP_THOMPSON_QRacrQG_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QRacrQG_DATA.DBL"
      MP_THOMPSON_QRacrQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QRacrQS_DATA.DBL"
      MP_THOMPSON_QIautQS_DATA.DBL: "{{ user.mpas_app }}/src/MPAS-Model/MP_THOMPSON_QIautQS_DATA.DBL"
      #
      # These are the new files for TEMPO.  The MP_TEMPO_... files are no
      # longer valid.
      #
      qr_acr_qs_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/qr_acr_qs_data_tempo_v3"
      qr_acr_qg_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/qr_acr_qg_data_tempo_v3"
      freeze_water_data_tempo_v3: "{{ user.mpas_app }}/src/MPAS-Model/freeze_water_data_tempo_v3"
      #
      # As of 03/27/2026, CCN_ACTIVATE_DATA is needed for the following
      # microphysics schemes:
      #
      # 1) mp_thompson_aerosols
      #    CCN_ACTIVATE_DATA is always read (via init_thompson_aerosols_forMPAS)
      # 2) mp_tempo
      #    CCN_ACTIVATE_DATA is read only if config_tempo_aerosolaware = .true.
      #    (via init_tempo_aerosols_forMPAS)
      #
      # For mp_thompson (without aerosols), mp_wsm6, mp_nssl2m, and all other 
      # micorphysics schemes, CCN_ACTIVATE_DATA is not read.
      #
      # Thus, we could use an if-statement to include or !remove the following,
      # but currently !remove doesn't seem to be working with uwtools.  So for
      # now, we include it regardless of the microphysics scheme.
      #
#      '{%- if user.config_mp == "mp_tempo" -%}CCN_ACTIVATE_DATA{%- else -%}unused{%- endif -%}': "{%- if user.config_mp == 'mp_tempo' -%} {{ user.mpas_app }}/src/MPAS-Model/CCN_ACTIVATE_DATA {%- else -%} None {%- endif -%}"
# The following needs to be in an if-statement, but not sure how to do it.
      CCN_ACTIVATE_DATA: "{{ user.mpas_app }}/src/MPAS-Model/CCN_ACTIVATE_DATA"
      #
      # ccn_activate.bin is only needed for TEMPO microphysics, so ideally we
      # should "!remove" it if config_mp is not set to "mp_tempo".  But since
      # "!remove" isn't working in uwtools, we just create the link regardless
      # of which microphysics is being used.
      #
      # If we have the MPAS-Model's top-level Makefile copy ccn_activate.bin
      # from its original creation location (under the TEMPO directory) to the
      # MPAS-Model top-level directory, then we can point the location below
      # to that top-level directory.  But for now, the Makefile doesn't do that
      # copy, so we point to the original creation directory.
      #
#      ccn_activate.bin: "{{ user.mpas_app }}/src/MPAS-Model/ccn_activate.bin"
      ccn_activate.bin: "{{ user.mpas_app }}/src/MPAS-Model/src/core_atmosphere/physics/physics_noaa/TEMPO/tables/ccn_activate.bin"
    lateral_boundary_conditions:
      interval_hours: 6
      offset: 0
      path: "{{ data.staged_ics_lbcs_dir }}/{{ user.mesh_label }}/{{ user.first_cycle.strftime('%Y%m%d%H') }}"
    length: 6
#    length: 3
    namelist:
      base_file: "{{ user.mpas_app }}/src/MPAS-Model/namelist.atmosphere"
      update_values:
        nhyd_model:
          config_dt: 60.0
        limited_area:
          config_apply_lbcs: true
        decomposition:
          config_block_decomp_file_prefix: "{{ user.mesh_label }}.graph.info.part."
        physics:
          config_physics_suite: convection_permitting
          config_microp_scheme: '{{ user.config_mp }}'
        physics_mp_tempo:
# Should set config_tempo_hailaware to !remove if not using TEMPO, but
# !remove is being treated as a string.  And so is "true" and "True" and
# "false" and "False"!
#          config_tempo_hailaware: '{%- if user.config_mp == "mp_tempo" -%} true {%- else -%} !remove {%- endif -%}'
#          config_tempo_hailaware: '{%- if user.config_mp == "mp_tempo" -%} True {%- else -%} False {%- endif -%}'
          config_tempo_hailaware: True
    rundir: '{{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast'
    streams:
      input:
        mutable: false
        type: input
        filename_template: "{{ user.mesh_label }}.init.nc"
        io_type: "pnetcdf,cdf5"
        input_interval: initial_only
#      restart:
#        mutable: false
#        type: "input;output"
#        filename_template: "restart.$Y-$M-$D_$h.$m.$s.nc"
#        io_type: "pnetcdf,cdf5"
#        input_interval: initial_only
#        output_interval: "1_00:00:00"
#        clobber_mode: overwrite
      output:
        mutable: true
        type: output
        filename_template: "history.$Y-$M-$D_$h.$m.$s.nc"
#        output_interval: "00:15:00"
        output_interval: "01:00:00"
        # Set to length of forecast to get only an initial output file and one
        # at the end of the forecast.
# Apparently the !timedelta constructor is not yet implemented in this
# version of uwtools.  Probably need to update uwtools.
#        output_interval: !timedelta '{{forecast.mpas.length}}'
#        output_interval: '{{forecast.mpas.length}}:00:00'
        files:
          - stream_list.atmosphere.output
        clobber_mode: overwrite
      diagnostics:
        mutable: true
        type: output
        filename_template: "diag.$Y-$M-$D_$h.$m.$s.nc"
#        output_interval: "00:15:00"
        output_interval: "01:00:00"
        # Set to length of forecast to get only an initial output file and one
        # at the end of the forecast.
# Apparently the !timedelta constructor is not yet implemented in this
# version of uwtools.  Probably need to update uwtools.
#        output_interval: !timedelta '{{forecast.mpas.length}}'
#        output_interval: '{{forecast.mpas.length}}:00:00'
        files:
          - stream_list.atmosphere.diagnostics
        clobber_mode: overwrite
#      surface:
#        mutable: true
#        type: input
#        filename_template: "x1.40962.sfc_update.nc"
#        io_type: "pnetcdf,cdf5"
#        filename_interval: "none"
#        input_interval: "none"
#        files:
#          - stream_list.atmosphere.surface
      lbc_in:
        mutable: false
        type: input
        filename_template: "lbc.$Y-$M-$D_$h.$m.$s.nc"
        filename_interval: "input_interval"
        io_type: "pnetcdf,cdf5"
        packages: limited_area
        input_interval: 06:00:00
  platform:
    account: '{{ platform.account }}'
    scheduler: '{{ platform.scheduler }}'
