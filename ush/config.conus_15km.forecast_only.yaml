user:
  cycle_frequency: 12
  #
  # If expt_basedir is set to an absolute path, it will be used as is.  If
  # it is not set or is set to an empty string, it will be set to a default
  # absolute path (currently specified in experiment_gen.py).  If it is set
  # to a relative path, it will be appended to the default path.  The path
  # to the experiment is then formed by appending the experiment name 
  # (expt_name below) to expt_basedir.
  #
  expt_basedir:
#  expt_basedir: "sppt_timing_tests/{{ user.mesh_label }}"
  #
  # Set the experiment name.  If this is set to an empty string (or is not
  # set at all) or if create_expt_name below is set to True, the experiment
  # name will be formed from the name of the last config file passed to the
  # experiment_gen.py script and, if create_expt_name is set to True, possibly
  # other parameters such as the mesh name.
  #
  expt_name: 
  #
  # If create_expt_name is True, the experiment name is always formed from
  # the name of the last config file passed on the command line to the
  # experiment_gen.py script and possibly other parameters such as the mesh
  # name, and the value of expt_name above is ignored.
  #
  create_expt_name: False
#  create_expt_name: True
#
# Note that !!timestamp will convert the given date and time such that
# first_cycle (for example) gets reset to this format (in Jinja2 syntax):
#
#   "{{ user.first_cycle.strftime('%Y%m%d%H') }}"
#
  first_cycle: !!timestamp 2023-09-15T00:00:00
  last_cycle:  !!timestamp 2023-09-15T00:00:00
#
  mesh_label: conus_15km
  mpas_app: ''
  platform: hera
##  build_type: 'debug'
#  build_type: 'optimized'
  config_mp: 'mp_tempo'
#  config_mp: 'mp_thompson'
  workflow_blocks:
    - cold_start_staged_ics_lbcs.yaml

auxil:
  MP_NAME: '{%- if user.config_mp == "mp_tempo" -%} TEMPO {%- else -%} THOMPSON {%- endif -%}'
  hailaware_str: '{%- if user.config_mp == "mp_tempo" -%}_HAILAWARE{%-endif-%}'

data:
#  mesh_files: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_MPAS_stoch/gsk_code_vary_MPAS_hash/meshes"
  mesh_files: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_WIW/mesh_and_static_files"
  staged_ics_lbcs_dir: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_MPAS_stoch/gsk_code_Ning_latest/mpas_staged_ics_lbcs"

platform:
  scheduler: slurm
#  account: fv3lam
#  account: zrtrr
  account: rtrr

wflow_launch:
  launch_script_fn: 'launch_wflow.py'
  launch_wrapper_fn: 'launch_wflow_wrapper.sh'
  launch_log_fn: 'log.launch_wflow'

cron:
  use_cron_to_relaunch: True
  cron_relaunch_intvl_mnts: 1
  # This will be set by the experiment generation script, so it doesn't matter what it
  # is set to here.  Leave it to its default value.
  crontab_line: None

